name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    name: test (go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1

      # Smoke-test the built binary the way a user runs it: generate config for
      # the sample repo and confirm --diff reports it as up to date (idempotent).
      - name: CLI smoke test
        run: |
          set -eux
          go build -ldflags "-X main.version=ci" -o atlantis-config-gen .
          ./atlantis-config-gen --root examples/sample --out /tmp/atlantis.yaml
          ./atlantis-config-gen --root examples/sample --out /tmp/atlantis.yaml --diff
          # The committed example must match a fresh generation.
          ./atlantis-config-gen --root examples/sample --out examples/sample/atlantis.yaml --diff
